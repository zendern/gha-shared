name: ruleset drift

# Read-only check that every repo in rulesets/repos.txt carries the shared
# "default-branch" ruleset. Fails (and GitHub emails the owner) on a missing or drifted
# ruleset; fix it locally with `rulesets/ruleset.sh apply`, which needs your own
# admin access, so no write credential is stored here.
#
# The token comes from a private GitHub App installed on those repos with only
# Repository > Administration: read (plus the default Metadata: read).
# Configure: variable RULESET_APP_CLIENT_ID, secret RULESET_APP_PRIVATE_KEY.
on:
  schedule:
    - cron: "23 7 * * 1" # Mondays 07:23 UTC, after Renovate's weekly window opens
  workflow_dispatch:

permissions: {}

concurrency:
  group: ruleset-drift
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # repos.txt is the single list of checked repos; the token gets exactly
      # those.
      - name: List checked repos
        id: repos
        run: |
          {
            echo "list<<EOF"
            grep -Ev '^[[:space:]]*(#|$)' rulesets/repos.txt
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      # Narrowed to read-only administration even if the app is later granted
      # more.
      - name: Mint read-only app token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RULESET_APP_CLIENT_ID }}
          private-key: ${{ secrets.RULESET_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.repos.outputs.list }}
          permission-administration: read
          permission-metadata: read

      - name: Check rulesets
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: rulesets/ruleset.sh check
