name: ci

# Runs on pull requests, and from merged.yml on a merge commit that main holds
# untested. It doesn't run on push to main: merged.yml decides whether a merge
# needs testing (every job bills a rounded-up minute).
on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Commit to test (merged.yml passes the merge commit).
        type: string
        required: false
        default: ""

permissions: {}

# A new push to a PR cancels its stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # `$/` runs this repo's actions at the workflow's own commit, so this PR's
      # versions are tested here before any repo picks them up. Other repos
      # call zendern/gha-shared/<action>@<tag>.
      - uses: $/setup
        with:
          # Empty on pull_request, which checks out the default ref.
          ref: ${{ inputs.ref }}
      - uses: $/checks

  # Single gate: what merged.yml's tree-check reads.
  workflow-summary:
    if: ${{ always() }}
    needs: [checks]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: re-actors/alls-green@v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
