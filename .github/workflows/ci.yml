name: ci

on:
  pull_request:

permissions: {}

# A new push to a PR cancels its stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # `$/` runs this repo's actions at the workflow's own commit, so this PR's
      # versions are tested here before any repo picks them up. Other repos
      # call zendern/gha-shared/<action>@<tag>.
      - uses: $/setup
      - uses: $/checks
