name: merged

# Runs on every push to main, so the CI it starts saves caches under main,
# where every pull request can restore them (a pull_request run can only save
# caches for its own PR). If the pushed commit's tree is identical to its PR
# head's and ci.yml's workflow-summary gate passed on that head, main holds
# exactly what was checked. ci.yml then re-runs only when the push changed a
# file the shared caches are keyed on, or main has no shared caches left, so a
# merge that needs no new cache bills only tree-check. Otherwise (main moved
# under the PR, or a direct push) ci.yml re-runs its checks on the commit. A
# release follows only once the commit is known checked, either way.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  tree-check:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
      actions: read # list main's caches
    outputs:
      tested: ${{ steps.tree.outputs.tested }}
      run-checks: ${{ steps.tree.outputs.run-checks }}
    steps:
      # This repo's own action, at this workflow's commit.
      - id: tree
        uses: $/tree-check
        with:
          merge-sha: ${{ github.sha }}
          before-sha: ${{ github.event.before }}

  checks:
    needs: [tree-check]
    if: ${{ needs.tree-check.outputs.run-checks == 'true' }}
    permissions:
      contents: read
    uses: $/.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  # Releases when the Conventional Commits since the last tag call for it: a fix
  # is a patch, a feat a minor, a breaking change (`!` or BREAKING CHANGE) a
  # major. Anything else releases nothing, unless it changed a shipped file
  # (see next-version in Taskfile.yml). Notes come from the merged PR titles.
  # Releases are immutable, so a published tag can't be moved.
  release:
    needs: [tree-check, checks]
    # Only a commit known to be checked: tree-check passed and either the
    # checks on main passed, or they were skipped because the PR's run covers
    # main. A cache-refresh run that fails still blocks the release.
    if: >-
      ${{ !cancelled()
      && needs.tree-check.result == 'success'
      && (needs.checks.result == 'success'
        || (needs.checks.result == 'skipped' && needs.tree-check.outputs.tested == 'true')) }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: write # create the release and its tag
    # One at a time, so two quick merges cannot both claim the same version.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: $/setup
        with:
          ref: ${{ github.sha }}
          # svu reads every commit since the last tag.
          fetch-depth: 0
      # svu runs through `go run`. This repo has no go.mod to pick a version
      # from; the go directive in svu's own module decides the toolchain.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: stable
          # A release job must not restore a cache a PR run could have written.
          cache: false
      - name: Release if the commits since the last tag call for one
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          next="$(task --silent next-version)"
          if [ -z "$next" ]; then
            echo "No release: nothing since the last tag is a fix, feat, or breaking change."
            exit 0
          fi
          gh release create "$next" --repo "$GITHUB_REPOSITORY" --target "$MERGE_SHA" --title "$next" --generate-notes
