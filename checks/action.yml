name: checks
description: >-
  Run every prek hook at the PREK_VERSION pinned in the repo's Taskfile.yml,
  then verify the workflow lockfile (.github/workflows/actions.lock) against
  GitHub with the manual-stage gh-actions-lock-verify hook from
  zendern/pre-commit-hooks, which the repo must configure. Run it after
  zendern/gha-shared/setup. Only a run on the default branch saves the prek
  hook cache.

inputs:
  extra-args:
    description: Arguments to `prek run`, after `--show-diff-on-failure --color=always`.
    required: false
    default: --all-files
  token:
    description: >-
      Token for zizmor's online audits (via prek) and for gh-actions-lock,
      which resolves every locked ref against GitHub. Needs contents:read on
      the repository; the default job token is enough for public actions.
    required: false
    default: ${{ github.token }}
  save-cache:
    description: >-
      'true' saves the prek hook cache at the end of the job, 'false' only
      restores it. Empty saves only on the default branch (a push or a
      scheduled run there), as setup does for the Go cache.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Read the prek version pinned in Taskfile.yml
      id: prek
      shell: bash
      run: |
        version="$(sed -n 's/^  PREK_VERSION: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' Taskfile.yml)"
        [ -n "$version" ] || { echo "::error file=Taskfile.yml::PREK_VERSION not found under vars:"; exit 1; }
        echo "version=$version" >>"$GITHUB_OUTPUT"

    # prek-action's own cache saves from every run, pull requests included, so
    # it is off; the steps below cache the same directory under the save rule.
    - name: Install prek
      uses: j178/prek-action@v3.1.0 # zizmor: ignore[unpinned-uses] locked via ci.yml's lockfile
      with:
        prek-version: ${{ steps.prek.outputs.version }}
        install-only: "true"
        cache: "false"

    # A changed config misses the key; restore-keys fall back to the newest
    # cache for the same prek version, so only the hooks whose rev changed are
    # rebuilt. `prek cache gc` (last step) drops the superseded environments
    # before the default branch saves.
    - name: Compute the prek cache key
      id: prek-cache
      shell: bash
      env:
        SAVE_CACHE: ${{ inputs.save-cache }}
        PREK_VERSION: ${{ steps.prek.outputs.version }}
        CONFIG_HASH: ${{ hashFiles('**/prek.toml', '**/.pre-commit-config.yaml', '**/.pre-commit-config.yml') }}
        DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        prefix="gha-shared-prek-${RUNNER_OS}-${RUNNER_ARCH}-${PREK_VERSION}-"
        {
          echo "key=${prefix}${CONFIG_HASH}"
          echo "restore-keys=${prefix}"
          echo "dir=$(prek cache dir)"
        } >>"$GITHUB_OUTPUT"
        case "$SAVE_CACHE" in
          true | false) save="$SAVE_CACHE" ;;
          "")
            save=false
            if [ "$GITHUB_EVENT_NAME" = schedule ] || [ "$GITHUB_REF" = "$DEFAULT_REF" ]; then
              save=true
            fi
            ;;
          *) echo "::error::save-cache must be 'true', 'false' or empty, got '$SAVE_CACHE'"; exit 1 ;;
        esac
        echo "save=$save" >>"$GITHUB_OUTPUT"

    # actions/cache saves in its post step at the end of the job; the
    # restore-only variant has no post step.
    - name: Restore the prek cache (saved at the end of the job)
      if: ${{ steps.prek-cache.outputs.save == 'true' }}
      uses: actions/cache@v6.1.0 # zizmor: ignore[unpinned-uses] locked via ci.yml's lockfile
      with:
        path: ${{ steps.prek-cache.outputs.dir }}
        key: ${{ steps.prek-cache.outputs.key }}
        restore-keys: ${{ steps.prek-cache.outputs.restore-keys }}

    - name: Restore the prek cache (not saved)
      if: ${{ steps.prek-cache.outputs.save != 'true' }}
      uses: actions/cache/restore@v6.1.0 # zizmor: ignore[unpinned-uses] locked via ci.yml's lockfile
      with:
        path: ${{ steps.prek-cache.outputs.dir }}
        key: ${{ steps.prek-cache.outputs.key }}
        restore-keys: ${{ steps.prek-cache.outputs.restore-keys }}

    # EXTRA_ARGS is word-split on purpose: it holds several arguments.
    - name: Run prek hooks
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        EXTRA_ARGS: ${{ inputs.extra-args }}
      run: |
        # shellcheck disable=SC2086
        prek run --show-diff-on-failure --color=always $EXTRA_ARGS

    # Runs even when a hook failed, so one run reports both. The hook (and its
    # gh-actions-lock version) comes from the repo's .pre-commit-config.yaml;
    # naming its id fails the step when a repo hasn't configured it, so the
    # check can't be skipped silently.
    - name: Verify the workflow lockfile
      if: ${{ !cancelled() }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: prek run --hook-stage manual gh-actions-lock-verify --all-files

    # Before the end-of-job save: drop hook environments the current config no
    # longer uses, which the restore-keys fallback brought along.
    - name: Prune unused prek environments
      if: ${{ !cancelled() && steps.prek-cache.outputs.save == 'true' }}
      shell: bash
      run: prek cache gc
